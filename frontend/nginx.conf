server {
    listen 80;
    server_name localhost;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        # Try to serve request as file, then directory, then fall back to index.html
        try_files $uri $uri/ /index.html;
    }

    # Optional: You might want to proxy API requests if backend and frontend are served on same domain/port
    # This is not strictly necessary if they are on different ports and CORS is handled by the backend.
    # location /api/ {
    #    proxy_pass http://backend_service_name:backend_port/; # Replace with actual backend service name and port
    #    proxy_set_header Host $host;
    #    proxy_set_header X-Real-IP $remote_addr;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #    proxy_set_header X-Forwarded-Proto $scheme;
    # }
}
